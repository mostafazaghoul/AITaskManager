<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Manager</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #f1f5f9;
            --surface:   #ffffff;
            --border:    #e2e8f0;
            --text:      #0f172a;
            --muted:     #64748b;
            --primary:   #4f46e5;
            --primary-h: #4338ca;
            --success:   #10b981;
            --danger:    #ef4444;
            --ai-bg:     #f5f3ff;
            --ai-border: #e0e7ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ── Header ─────────────────────────────────── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-weight: 700;
            font-size: 1rem;
        }

        .logo-icon {
            width: 28px; height: 28px;
            background: var(--primary);
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 0.8rem; font-weight: 800;
        }

        .header-link {
            font-size: 0.78rem;
            color: var(--muted);
            text-decoration: none;
            padding: 0.3rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all .15s;
        }
        .header-link:hover { color: var(--text); border-color: #94a3b8; }

        /* ── Layout ──────────────────────────────────── */
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 1.75rem 2rem;
            display: grid;
            grid-template-columns: 1fr 310px;
            gap: 1.5rem;
            align-items: start;
        }

        /* ── Card ────────────────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem 1.4rem;
        }
        .card + .card { margin-top: 1.2rem; }

        .card-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--muted);
            margin-bottom: .9rem;
        }

        /* ── Smart Add card ──────────────────────────── */
        .smart-card {
            background: linear-gradient(135deg, #faf5ff, #ede9fe);
            border-color: var(--ai-border);
        }

        .smart-header {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin-bottom: .65rem;
            font-weight: 600;
            font-size: .88rem;
        }

        .tag-ai {
            font-size: .62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            background: var(--primary);
            color: white;
            padding: .1rem .35rem;
            border-radius: 4px;
        }

        .smart-row {
            display: flex;
            gap: .5rem;
        }

        .smart-row input {
            flex: 1;
            padding: .55rem .8rem;
            border: 1px solid var(--ai-border);
            border-radius: 8px;
            font-size: .875rem;
            font-family: inherit;
            background: white;
            color: var(--text);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .smart-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,.12);
        }

        .smart-hint {
            margin-top: .5rem;
            font-size: .72rem;
            color: #7c3aed;
            opacity: .75;
        }

        /* ── Form ────────────────────────────────────── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .7rem;
        }

        .field { display: flex; flex-direction: column; gap: .28rem; }
        .field.span2 { grid-column: 1 / -1; }

        label { font-size: .76rem; font-weight: 500; color: var(--muted); }

        input[type="text"],
        input[type="datetime-local"],
        textarea,
        select {
            padding: .48rem .72rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: .875rem;
            font-family: inherit;
            color: var(--text);
            background: var(--bg);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        textarea { resize: vertical; min-height: 52px; }
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(79,70,229,.1);
        }

        @keyframes formHighlight {
            0%   { box-shadow: 0 0 0 3px rgba(79,70,229,.35); border-color: var(--primary); }
            100% { box-shadow: none; border-color: var(--border); }
        }
        .field-highlight input,
        .field-highlight textarea,
        .field-highlight select {
            animation: formHighlight 1.8s ease forwards;
        }

        .form-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: .7rem;
        }

        /* ── Buttons ─────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: .38rem;
            padding: .48rem .95rem;
            border-radius: 8px;
            font-size: .84rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all .15s;
            font-family: inherit;
            white-space: nowrap;
        }
        .btn:disabled { opacity: .5; cursor: not-allowed; }

        .btn-primary    { background: var(--primary); color: white; }
        .btn-primary:not(:disabled):hover { background: var(--primary-h); }

        .btn-ai {
            background: var(--primary);
            color: white;
            padding: .5rem .9rem;
        }
        .btn-ai:not(:disabled):hover { background: var(--primary-h); }

        .btn-block { width: 100%; justify-content: center; padding: .55rem; }

        .btn-ghost {
            background: white;
            color: var(--primary);
            border: 1px solid var(--ai-border);
        }
        .btn-ghost:not(:disabled):hover { background: var(--ai-bg); border-color: var(--primary); }

        .btn-icon {
            padding: .28rem .42rem;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: #cbd5e1;
            font-size: .78rem;
            cursor: pointer;
        }
        .btn-icon:hover { border-color: var(--danger); color: var(--danger); background: #fff1f2; }

        /* ── Task list ───────────────────────────────── */
        .tasks-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: .85rem;
        }

        .filters { display: flex; gap: .28rem; }

        .filter-btn {
            padding: .28rem .6rem;
            border-radius: 6px;
            font-size: .76rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            transition: all .15s;
            font-family: inherit;
        }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        #task-list { display: flex; flex-direction: column; gap: .42rem; min-height: 56px; }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: .65rem;
            padding: .75rem .85rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            transition: opacity .2s;
            animation: fadeIn .18s ease;
        }
        @keyframes fadeIn {
            from { opacity:0; transform:translateY(-4px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .task-item.done { opacity: .45; background: var(--bg); }
        .task-item.done .task-title { text-decoration: line-through; color: var(--muted); }

        /* left accent bar by priority */
        .task-item { border-left-width: 3px; }
        .pri-High   { border-left-color: #ef4444; }
        .pri-Medium { border-left-color: #f59e0b; }
        .pri-Low    { border-left-color: #86efac; }

        .task-check {
            margin-top: 2px;
            width: 14px; height: 14px;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: var(--success);
        }

        .task-body { flex: 1; min-width: 0; }

        .task-title {
            font-size: .875rem;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .task-desc {
            font-size: .77rem;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: .08rem;
        }
        .task-meta {
            display: flex;
            align-items: center;
            gap: .4rem;
            margin-top: .28rem;
            flex-wrap: wrap;
        }

        /* ── Badges ──────────────────────────────────── */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: .1rem .42rem;
            border-radius: 4px;
            font-size: .66rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        /* Category */
        .cat-Work          { background:#dbeafe; color:#1d4ed8; }
        .cat-Personal      { background:#ede9fe; color:#7c3aed; }
        .cat-Learning      { background:#cffafe; color:#0e7490; }
        .cat-Health        { background:#d1fae5; color:#065f46; }
        .cat-Finance       { background:#fef3c7; color:#92400e; }
        .cat-Home          { background:#ffedd5; color:#c2410c; }
        .cat-Other         { background:#f1f5f9; color:#64748b; }
        .cat-Uncategorized { background:#f1f5f9; color:#64748b; }

        /* Priority */
        .pri-badge-High   { background:#fee2e2; color:#b91c1c; }
        .pri-badge-Medium { background:#fef3c7; color:#92400e; }
        .pri-badge-Low    { background:#dcfce7; color:#166534; }

        .due-label { font-size: .72rem; color: var(--muted); }
        .due-label.overdue { color: #dc2626; font-weight: 600; }

        .task-actions { flex-shrink: 0; }

        .empty-state {
            text-align: center;
            padding: 2.2rem 1rem;
            color: var(--muted);
            font-size: .84rem;
        }

        /* ── AI panel ────────────────────────────────── */
        .ai-panel { position: sticky; top: 72px; }

        .ai-card {
            background: linear-gradient(160deg, #fafafa, var(--ai-bg));
            border: 1px solid var(--ai-border);
            border-radius: 12px;
            padding: 1.2rem;
        }

        .ai-heading {
            display: flex;
            align-items: center;
            gap: .45rem;
            font-weight: 600;
            font-size: .88rem;
            margin-bottom: .85rem;
        }

        .ai-actions { display: flex; flex-direction: column; gap: .45rem; }

        hr.ai-divider {
            border: none;
            border-top: 1px solid var(--ai-border);
            margin: .9rem 0 .7rem;
        }

        .ai-result-title {
            font-size: .7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--primary);
            margin-bottom: .55rem;
        }

        .ai-plan-text {
            font-size: .81rem;
            line-height: 1.75;
            color: var(--text);
            white-space: pre-wrap;
        }

        .overdue-list { display: flex; flex-direction: column; gap: .32rem; }

        .overdue-item {
            font-size: .79rem;
            padding: .38rem .55rem;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            border-radius: 6px;
            color: #be123c;
        }

        /* ── Spinner ─────────────────────────────────── */
        .spinner {
            display: inline-block;
            width: 11px; height: 11px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .65s linear infinite;
            flex-shrink: 0;
        }
        .spinner.dark {
            border-color: rgba(79,70,229,.2);
            border-top-color: var(--primary);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .thinking {
            display: flex;
            align-items: center;
            gap: .45rem;
            color: var(--muted);
            font-size: .81rem;
            padding: .35rem 0;
        }

        /* ── Toast ───────────────────────────────────── */
        #toast {
            position: fixed;
            bottom: 1.4rem;
            right: 1.4rem;
            padding: .6rem 1rem;
            border-radius: 8px;
            font-size: .84rem;
            font-weight: 500;
            color: white;
            opacity: 0;
            transform: translateY(5px);
            transition: all .22s;
            pointer-events: none;
            z-index: 999;
            max-width: 320px;
        }
        #toast.show { opacity: 1; transform: translateY(0); }
        #toast.ok  { background: var(--success); }
        #toast.err { background: var(--danger); }
        #toast.info { background: var(--primary); }

        /* ── Responsive ──────────────────────────────── */
        @media (max-width: 720px) {
            .container { grid-template-columns: 1fr; padding: 1rem; }
            .ai-panel  { position: static; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon">✓</div>
        AI Task Manager
    </div>
    <a class="header-link" href="/docs" target="_blank">API Docs ↗</a>
</header>

<main class="container">

    <!-- ── Left column ───────────────────────────── -->
    <div>

        <!-- Smart Add -->
        <div class="card smart-card">
            <div class="smart-header">
                <span>✨ Smart Add</span>
                <span class="tag-ai">AI</span>
            </div>
            <div class="smart-row">
                <input type="text" id="smart-input"
                    placeholder="Try: 'urgent report due Friday' or 'call dentist tomorrow at 2pm'"
                    onkeydown="if(event.key==='Enter')smartParse()">
                <button class="btn btn-ai" id="smart-btn" onclick="smartParse()">
                    Parse
                </button>
            </div>
            <p class="smart-hint">AI extracts the title, due date, and priority — then fills the form below for you to review.</p>
        </div>

        <!-- Manual form -->
        <div class="card" id="task-form-card">
            <div class="card-title">New Task</div>
            <form id="task-form">
                <div class="form-grid">
                    <div class="field" id="field-title">
                        <label for="f-title">Title *</label>
                        <input type="text" id="f-title" placeholder="e.g. Read Clean Code" required>
                    </div>
                    <div class="field" id="field-priority">
                        <label for="f-priority">Priority</label>
                        <select id="f-priority">
                            <option value="Medium" selected>Medium</option>
                            <option value="High">🔴 High</option>
                            <option value="Low">🟢 Low</option>
                        </select>
                    </div>
                    <div class="field" id="field-due">
                        <label for="f-due">Due Date</label>
                        <input type="datetime-local" id="f-due">
                    </div>
                    <div class="field span2" id="field-desc">
                        <label for="f-desc">Description</label>
                        <textarea id="f-desc" placeholder="Optional details…"></textarea>
                    </div>
                </div>
                <div class="form-footer">
                    <button type="submit" class="btn btn-primary" id="add-btn">
                        + Add Task
                    </button>
                </div>
            </form>
        </div>

        <!-- Task list -->
        <div class="card">
            <div class="tasks-header">
                <span class="card-title" style="margin:0" id="task-count">Tasks</span>
                <div class="filters">
                    <button class="filter-btn active" data-f="all">All</button>
                    <button class="filter-btn" data-f="active">Active</button>
                    <button class="filter-btn" data-f="done">Done</button>
                </div>
            </div>
            <div id="task-list"><div class="empty-state">Loading…</div></div>
        </div>

    </div>

    <!-- ── Right column (AI) ──────────────────────── -->
    <aside class="ai-panel">
        <div class="ai-card">
            <div class="ai-heading">🤖 AI Assistant</div>
            <div class="ai-actions">
                <button class="btn btn-ai btn-block" id="plan-btn" onclick="generatePlan()">
                    ✨ Generate Daily Plan
                </button>
                <button class="btn btn-ghost btn-block" id="overdue-btn" onclick="loadOverdue()">
                    ⚠️ Show Overdue Tasks
                </button>
            </div>
            <div id="ai-result" style="display:none">
                <hr class="ai-divider">
                <div class="ai-result-title" id="ai-result-title"></div>
                <div id="ai-result-body"></div>
            </div>
        </div>
    </aside>

</main>

<div id="toast"></div>

<script>
    /* ── State ─────────────────────────────────────── */
    let tasks  = [];
    let filter = 'all';

    /* ── Boot ──────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', () => {
        fetchTasks();
        document.getElementById('task-form').addEventListener('submit', createTask);
        document.querySelectorAll('.filter-btn').forEach(btn =>
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filter = btn.dataset.f;
                render();
            })
        );
    });

    /* ── API helper ────────────────────────────────── */
    async function api(path, opts = {}) {
        const res = await fetch(path, {
            headers: { 'Content-Type': 'application/json' },
            ...opts,
        });
        if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.detail || `HTTP ${res.status}`);
        }
        return res.json();
    }

    /* ── Smart parse ───────────────────────────────── */
    async function smartParse() {
        const input = document.getElementById('smart-input');
        const btn   = document.getElementById('smart-btn');
        const text  = input.value.trim();
        if (!text) return;

        setBtn(btn, '<span class="spinner"></span>', true);
        try {
            const parsed = await api('/ai/parse', {
                method: 'POST',
                body: JSON.stringify({ text }),
            });

            // Fill the form
            document.getElementById('f-title').value = parsed.title || '';
            document.getElementById('f-desc').value  = parsed.description || '';
            document.getElementById('f-priority').value = parsed.priority || 'Medium';

            if (parsed.due_date) {
                document.getElementById('f-due').value = toDatetimeLocal(parsed.due_date);
            } else {
                document.getElementById('f-due').value = '';
            }

            // Animate filled fields
            ['field-title','field-priority','field-due','field-desc'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('field-highlight');
                void el.offsetWidth; // reflow to restart animation
                el.classList.add('field-highlight');
            });

            // Scroll to form and focus
            document.getElementById('task-form-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            input.value = '';

            const parts = [`"${parsed.title}"`];
            if (parsed.due_date) parts.push(`due ${fmtDate(new Date(parsed.due_date))}`);
            if (parsed.priority !== 'Medium') parts.push(`${parsed.priority} priority`);
            toast(`Parsed: ${parts.join(' · ')} — review and click Add Task`, 'info');
        } catch (err) {
            toast('Parse failed: ' + err.message, 'err');
        } finally {
            setBtn(btn, 'Parse', false);
        }
    }

    /* ── Load & render tasks ───────────────────────── */
    async function fetchTasks() {
        try {
            tasks = await api('/tasks/');
            render();
        } catch (e) {
            document.getElementById('task-list').innerHTML =
                `<div class="empty-state">Could not load tasks: ${esc(e.message)}</div>`;
        }
    }

    function render() {
        const list    = document.getElementById('task-list');
        const countEl = document.getElementById('task-count');

        let visible = tasks;
        if (filter === 'active') visible = tasks.filter(t => !t.completed);
        if (filter === 'done')   visible = tasks.filter(t =>  t.completed);

        const active = tasks.filter(t => !t.completed).length;
        countEl.textContent = `Tasks — ${active} active`;

        if (!visible.length) {
            const msg = { all: 'No tasks yet. Add one above!', active: 'No active tasks — great job! 🎉', done: 'Nothing completed yet.' };
            list.innerHTML = `<div class="empty-state">${msg[filter]}</div>`;
            return;
        }

        list.innerHTML = '';
        [...visible].reverse().forEach(t => list.appendChild(taskEl(t)));
    }

    function taskEl(t) {
        const due    = t.due_date ? new Date(t.due_date) : null;
        const late   = due && due < new Date() && !t.completed;
        const dueStr = due
            ? `<span class="due-label${late ? ' overdue' : ''}">${late ? '⚠ ' : ''}${fmtDate(due)}</span>`
            : '';

        const el = document.createElement('div');
        el.className = `task-item pri-${t.priority}${t.completed ? ' done' : ''}`;
        el.id = `t-${t.id}`;
        el.innerHTML = `
            <input class="task-check" type="checkbox" ${t.completed ? 'checked' : ''}
                onchange="toggle(${t.id}, this.checked)">
            <div class="task-body">
                <div class="task-title">${esc(t.title)}</div>
                ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ''}
                <div class="task-meta">
                    <span class="badge pri-badge-${esc(t.priority)}">${esc(t.priority)}</span>
                    <span class="badge cat-${esc(t.category)}">${esc(t.category)}</span>
                    ${dueStr}
                </div>
            </div>
            <div class="task-actions">
                <button class="btn btn-icon" title="Delete" onclick="remove(${t.id})">✕</button>
            </div>`;
        return el;
    }

    /* ── Create ────────────────────────────────────── */
    async function createTask(e) {
        e.preventDefault();
        const btn   = document.getElementById('add-btn');
        const title = document.getElementById('f-title').value.trim();
        const desc  = document.getElementById('f-desc').value.trim();
        const due   = document.getElementById('f-due').value;
        const pri   = document.getElementById('f-priority').value;
        if (!title) return;

        setBtn(btn, '<span class="spinner"></span> Adding…', true);
        try {
            const body = { title, priority: pri };
            if (desc) body.description = desc;
            if (due)  body.due_date = new Date(due).toISOString();

            const task = await api('/tasks/', { method: 'POST', body: JSON.stringify(body) });
            tasks.push(task);
            render();
            e.target.reset();
            document.getElementById('f-priority').value = 'Medium';
            toast(`Added "${task.title}" — categorized as ${task.category}`, 'ok');
        } catch (err) {
            toast('Failed: ' + err.message, 'err');
        } finally {
            setBtn(btn, '+ Add Task', false);
        }
    }

    /* ── Toggle ────────────────────────────────────── */
    async function toggle(id, completed) {
        try {
            const updated = await api(`/tasks/${id}`, {
                method: 'PUT',
                body: JSON.stringify({ completed }),
            });
            tasks = tasks.map(t => t.id === id ? updated : t);
            render();
            toast(completed ? 'Marked as done ✓' : 'Re-opened.', 'ok');
        } catch (err) {
            toast('Update failed: ' + err.message, 'err');
            fetchTasks();
        }
    }

    /* ── Delete ────────────────────────────────────── */
    async function remove(id) {
        try {
            await api(`/tasks/${id}`, { method: 'DELETE' });
            tasks = tasks.filter(t => t.id !== id);
            render();
            toast('Task deleted.', 'ok');
        } catch (err) {
            toast('Delete failed: ' + err.message, 'err');
        }
    }

    /* ── AI: Daily Plan ────────────────────────────── */
    async function generatePlan() {
        const btn = document.getElementById('plan-btn');
        setBtn(btn, '<span class="spinner"></span> Thinking…', true);
        showAiResult('✨ Daily Plan', '<div class="thinking"><span class="spinner dark"></span> GPT is writing your plan…</div>');
        try {
            const { plan } = await api('/ai/plan/daily');
            setAiBody(`<div class="ai-plan-text">${esc(plan)}</div>`);
        } catch (err) {
            setAiBody(`<span style="color:var(--danger);font-size:.82rem">Error: ${esc(err.message)}</span>`);
        } finally {
            setBtn(btn, '✨ Generate Daily Plan', false);
        }
    }

    /* ── AI: Overdue ───────────────────────────────── */
    async function loadOverdue() {
        const btn = document.getElementById('overdue-btn');
        setBtn(btn, '<span class="spinner dark"></span> Loading…', true);
        showAiResult('⚠️ Overdue Tasks', '<div class="thinking"><span class="spinner dark"></span> Checking…</div>');
        try {
            const list = await api('/ai/summary/overdue');
            if (!list.length) {
                setAiBody('<p style="font-size:.82rem;color:var(--muted)">No overdue tasks — you\'re on track! ✅</p>');
            } else {
                setAiBody(`<div class="overdue-list">${
                    list.map(t => `<div class="overdue-item">
                        <strong>${esc(t.title)}</strong>${t.due_date ? ` — ${fmtDate(new Date(t.due_date))}` : ''}
                    </div>`).join('')
                }</div>`);
            }
        } catch (err) {
            setAiBody(`<span style="color:var(--danger);font-size:.82rem">Error: ${esc(err.message)}</span>`);
        } finally {
            setBtn(btn, '⚠️ Show Overdue Tasks', false);
        }
    }

    /* ── Helpers ───────────────────────────────────── */
    function showAiResult(title, bodyHtml) {
        document.getElementById('ai-result').style.display = 'block';
        document.getElementById('ai-result-title').textContent = title;
        document.getElementById('ai-result-body').innerHTML = bodyHtml;
    }
    function setAiBody(html) {
        document.getElementById('ai-result-body').innerHTML = html;
    }
    function setBtn(btn, html, disabled) {
        btn.innerHTML = html;
        btn.disabled  = disabled;
    }

    function toDatetimeLocal(iso) {
        const d = new Date(iso);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function fmtDate(d) {
        const diff = Math.round((d - new Date()) / 86400000);
        if (diff === 0)  return 'Today';
        if (diff === 1)  return 'Tomorrow';
        if (diff === -1) return 'Yesterday';
        if (Math.abs(diff) < 7) return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function esc(s) {
        return String(s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    let toastT;
    function toast(msg, type = 'ok') {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = `show ${type}`;
        clearTimeout(toastT);
        toastT = setTimeout(() => el.className = '', 3500);
    }
</script>
</body>
</html>
